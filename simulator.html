<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Quantum Simulator</title>

    <link rel="stylesheet" href="style.css">

    <!-- MathJax -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>

    <script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

</head>

<body>

    <h1>Quantum Simulator</h1>

    <div class="simulator-container">

        <!-- LEFT PANEL -->

        <div class="left-panel">

            <h2>State Input</h2>

            <p>
                \( |\psi\rangle = a|0\rangle + b|1\rangle \)
            </p>

            <input
                type="number"
                id="coeffA"
                placeholder="Enter value of a">

            <input
                type="number"
                id="coeffB"
                placeholder="Enter value of b">


            <h2>Operator</h2>

            <select id="operatorSelect">

                <option value="identity">
                    Identity
                </option>

                <option value="pauliX">
                    Pauli-X
                </option>

                <option value="pauliZ">
                    Pauli-Z
                </option>

                <option value="hadamard">
                    Hadamard
                </option>

            </select>

            <p>
                Operator Matrix:
            </p>

            <p id="operatorMatrix">

                \( \begin{bmatrix}
                1 & 0 \\
                0 & 1
                \end{bmatrix} \)

            </p>


            <h2>Measurement</h2>

            <button id="measureBtn">
                Measure State
            </button>

        </div>



        <!-- RIGHT PANEL -->

        <div class="right-panel">

            <h2>Results</h2>

            <p>
                Output State:
            </p>

            <p id="outputState">
                \( |\psi\rangle = ? \)
            </p>

            <p id="normalizationMsg"
                style="color: #ffd166;
                font-weight: bold;">
            </p>


            <p>
                Probabilities:
            </p>

            <div id="probabilities">

                <p id="label0">P(0) = 0</p>

                <div class="bar-container">

                    <div id="bar0" class="bar"></div>

                </div>

                <p id="label1">P(1) = 0</p>

                <div class="bar-container">

                    <div id="bar1" class="bar"></div>

                </div>

            </div>

        </div> <!-- right-panel -->

    </div> <!-- simulator-container -->


    <br>

    <button onclick="window.location.href='index.html'">
        ⬅ Back to Home
    </button>

    <script src="script.js"></script>

</body>

</html>
